<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eddy3D Visualiser</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app">
    <a href="#canvas-container" class="skip-to-content">Skip to 3D Canvas</a>
    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Sidebar" title="Toggle Sidebar" aria-expanded="false" aria-controls="ui-container">
      <span class="arrow-icon" aria-hidden="true"></span>
    </button>
    <div id="ui-container">
      <header>
        <h1 class="logo-container">
          <img src="/LogoEddy.png" alt="Eddy3D Visualiser" class="main-logo">
        </h1>
        <div id="version-badge" class="version-badge" title="Build version"></div>
      </header>
      <section id="controls">

        <div class="control-group">
          <div class="select-container">
            <div class="download-row">
              <label for="csv-upload" class="custom-file-upload" title="Upload individual CSV files">
                Upload Files
                <input type="file" id="csv-upload" accept=".csv" multiple class="sr-only">
              </label>
              <label for="folder-upload" class="custom-file-upload" title="Upload a folder of CSV files">
                Upload Folder
                <input type="file" id="folder-upload" webkitdirectory directory multiple class="sr-only">
              </label>
            </div>
          </div>
          <div class="select-container">
            <div class="download-row">
              <button id="download-screenshots" class="download-btn" disabled title="Upload a dataset to enable downloads" aria-live="polite">
                Download Screenshots
              </button>
              <select id="dpi-select" class="dpi-select" disabled aria-label="Screenshot DPI" title="Upload a dataset to enable downloads">
                <option value="100">100px</option>
                <option value="150" selected>150px</option>
                <option value="300">300px</option>
                <option value="600">600px</option>
                <option value="1200">1200px</option>
              </select>
            </div>
          </div>
          <div class="select-container">
            <label for="results-select">Results:</label>
            <select id="results-select" class="results-select" disabled title="Upload a dataset to select results">
              <option value="" disabled selected>Select a result set...</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <h3>View Settings</h3>
          <div class="toggle-item" title="Switch to a top-down orthographic camera view">
            <label for="top-view" class="toggle-label">Top View</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="top-view" aria-label="Top View">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Automatically rotate the 3D scene">
            <label for="auto-rotate" class="toggle-label">Auto-rotate</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="auto-rotate" aria-label="Auto-rotate">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Toggle between perspective and 2D orthographic camera">
            <label for="perspective-mode" class="toggle-label">Perspective Mode</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="perspective-mode" aria-label="Perspective Mode">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Show or hide the ground reference grid">
            <label for="grid" class="toggle-label">Grid</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="grid" aria-label="Grid">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Show or hide the 3D building context models">
            <label for="show-buildings" class="toggle-label">Show Buildings</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="show-buildings" checked aria-label="Show Buildings">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Show or hide the outlines of the building models">
            <label for="show-edges" class="toggle-label">Show Edges</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="show-edges" checked aria-label="Show Edges">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Render points as a continuous surface without gaps between them">
            <label for="gapless-points" class="toggle-label">Gapless Points</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="gapless-points" checked aria-label="Gapless Points">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item disabled" id="point-size-control" style="flex-direction: column; align-items: flex-start;" title="Disable 'Gapless Points' to adjust manually">
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 8px;">
              <label for="point-size">Point Size</label>
              <span id="point-size-display" style="font-size: 0.8em; color: var(--text-secondary);">3.0</span>
            </div>
            <input type="range" id="point-size" min="0.1" max="10" value="3" step="0.1" class="range-input" disabled aria-label="Point Size" title="Disable 'Gapless Points' to adjust manually">
          </div>
          <div class="toggle-item" title="Make individual points always face the camera (billboarding)">
            <label for="rotate-to-camera" class="toggle-label">Rotate To Camera</label>
            <label class="switch">
              <input type="checkbox" role="switch" id="rotate-to-camera" aria-label="Rotate To Camera">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-item" title="Select the color mapping for the values">
            <label for="colormap-select">Colormap</label>
            <select id="colormap-select" aria-label="Colormap Selection" class="colormap-select">
              <option value="turbo">Turbo</option>
              <option value="jet" selected>Jet</option>
              <option value="viridis">Viridis</option>
              <option value="inferno">Inferno</option>
              <option value="magma">Magma</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <button class="collapsible-header" id="advanced-toggle" type="button" aria-expanded="false" aria-controls="advanced-content" title="Show advanced settings">
            <h3>Advanced</h3>
            <span class="icon" aria-hidden="true">▼</span>
          </button>
          <div class="collapsible-content" id="advanced-content" role="region" aria-label="Advanced Settings" style="display: none;">
            <div class="toggle-item" style="flex-direction: column; align-items: flex-start;" title="Set the minimum value for the colormap scale">
              <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 8px;">
                <label for="colormap-min">Min Value</label>
                <span id="min-val-display" style="font-size: 0.8em; color: var(--text-secondary);">0</span>
              </div>
              <input type="range" id="colormap-min" class="range-input" aria-label="Colormap Minimum Value">
            </div>
            <div class="toggle-item" style="flex-direction: column; align-items: flex-start;" title="Set the maximum value for the colormap scale">
              <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 8px;">
                <label for="colormap-max">Max Value</label>
                <span id="max-val-display" style="font-size: 0.8em; color: var(--text-secondary);">1</span>
              </div>
              <input type="range" id="colormap-max" class="range-input" aria-label="Colormap Maximum Value">
            </div>
          </div>
        </div>
      </section>

    </div>
    <main id="canvas-container" aria-label="3D Visualization Canvas" tabindex="-1">
      <div id="empty-state" class="empty-state" style="display: none;" aria-live="polite">
        <div class="empty-state-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="empty-icon" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <h2>No Dataset Loaded</h2>
          <p>Upload a CSV file/folder, or drag & drop files here to visualize the 3D simulation results.</p>
          <div class="empty-state-actions">
            <label for="empty-csv-upload" class="custom-file-upload" title="Upload individual CSV files">
              Upload Files
              <input type="file" id="empty-csv-upload" accept=".csv" multiple class="sr-only">
            </label>
            <label for="empty-folder-upload" class="custom-file-upload" title="Upload a folder of CSV files">
              Upload Folder
              <input type="file" id="empty-folder-upload" webkitdirectory directory multiple class="sr-only">
            </label>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
