name: Sync dev and main branches

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      direction:
        description: 'Sync direction'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - main-to-dev
          - dev-to-main

permissions:
  contents: write

jobs:
  sync-main-to-dev:
    name: Sync main → dev
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.direction == 'both' || github.event.inputs.direction == 'main-to-dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into dev
        run: |
          git checkout dev
          git merge origin/main --no-edit -m "chore: sync main into dev [skip ci]" || {
            echo "Merge conflict detected, attempting auto-resolution..."
            git merge --abort
            exit 1
          }
          git push origin dev

  sync-dev-to-main:
    name: Sync dev → main
    if: |
      github.event_name == 'workflow_dispatch' && (github.event.inputs.direction == 'both' || github.event.inputs.direction == 'dev-to-main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          git checkout main
          git merge origin/dev --no-edit -m "chore: sync dev into main [skip ci]" || {
            echo "Merge conflict detected, attempting auto-resolution..."
            git merge --abort
            exit 1
          }
          git push origin main

  set-default-branch:
    name: Ensure dev is default branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set dev as default branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              default_branch: 'dev'
            });
            console.log('Default branch set to dev');
